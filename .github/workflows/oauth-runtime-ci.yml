name: SHINO OAuth Runtime CI

on:
  push:
    branches: [integration/jarvis-upstream]
  pull_request:
    branches: [main]

jobs:
  oauth-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact pinned Jarvis runtime
        shell: powershell
        run: |
          $env:SHINO_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'shino-oauth-runtime'
          $jarvis = Join-Path $env:SHINO_RUNTIME_ROOT 'jarvis-OS'
          New-Item -ItemType Directory -Force -Path $jarvis | Out-Null
          git -C $jarvis init
          git -C $jarvis remote add origin https://github.com/Grominet95/jarvis-OS.git
          git -C $jarvis fetch --depth=1 origin 570200276bad54dd4dba49843deb785c000bc19f
          if ($LASTEXITCODE -ne 0) { throw 'failed to fetch pinned Jarvis runtime' }
          git -C $jarvis checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'failed to checkout pinned Jarvis runtime' }

      - name: Patch exact runtime twice
        shell: powershell
        run: |
          $env:SHINO_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'shino-oauth-runtime'
          $env:SHINO_JARVIS_PORT = '18777'
          .\scripts\sync_google_oauth.ps1
          .\scripts\sync_google_oauth.ps1

      - name: Validate patched runtime
        shell: powershell
        run: |
          $jarvis = Join-Path $env:RUNNER_TEMP 'shino-oauth-runtime\jarvis-OS'
          $api = Join-Path $jarvis 'src\jarvis\interfaces\api\google_oauth.py'
          $js = Join-Path $jarvis 'src\jarvis\interfaces\ui\static\capabilities.js'
          $html = Join-Path $jarvis 'src\jarvis\interfaces\ui\static\capabilities.html'

          node --check $js
          if ($LASTEXITCODE -ne 0) { throw 'patched capabilities.js syntax invalid' }
          python -m py_compile $api
          if ($LASTEXITCODE -ne 0) { throw 'patched google_oauth.py syntax invalid' }

          $ui = Get-Content $js -Raw
          $oauth = Get-Content $api -Raw
          $page = Get-Content $html -Raw

          if ($ui -match 'inp\.value\s*=\s*v') { throw 'masked settings are still written into editable inputs' }
          if ($ui -notmatch 'Déjà configuré') { throw 'configured-placeholder guard missing' }
          if ($ui -match '__SHINO_GOOGLE_OAUTH_WINDOW__|window\.open\(') { throw 'popup OAuth code present' }
          if ($ui -notmatch 'target\.location\.href\s*=\s*cfg\.url') { throw 'top-level same-tab OAuth navigation missing' }
          if ($oauth -notmatch 'http://localhost:18777/api/google/callback') { throw 'canonical OAuth callback missing' }
          if ($oauth -notmatch 'invalid_client_config') { throw 'masked/invalid client guard missing' }
          if ($oauth -notmatch '_maybe_write_credentials_from_env\(request\)') { throw 'Jarvis credential regeneration call missing' }
          if ($page -notmatch 'capabilities\.js\?v=shino-oauth-clean-4') { throw 'capabilities cache bust missing' }

          Write-Host 'exact pinned Jarvis OAuth runtime patch: OK'
