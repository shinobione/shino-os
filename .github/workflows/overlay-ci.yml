name: SHINO Overlay CI

on:
  push:
    branches: [integration/jarvis-upstream]
  pull_request:
    branches: [main]

jobs:
  overlay-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SHINO overlay
        run: python scripts/validate_overlay.py
      - name: Check SHINO JavaScript syntax
        run: |
          find extensions/views/shino-command-center extensions/global -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Compile Python view package
        run: |
          python -m py_compile \
            extensions/views/shino-command-center/tool.py \
            extensions/views/shino-command-center/skill.py

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell launchers
        shell: powershell
        run: |
          foreach ($file in @('.\shino.ps1', '.\scripts\sync_global_nav.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "$file parse: OK"
          }
      - name: Smoke legacy global navigation cleanup
        shell: powershell
        run: |
          $env:SHINO_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'shino-nav-runtime'
          $static = Join-Path $env:SHINO_RUNTIME_ROOT 'jarvis-OS\src\jarvis\interfaces\ui\static'
          New-Item -ItemType Directory -Force -Path $static | Out-Null
          $fixture = @'
          (function(){ window.Jarvis = window.Jarvis || {}; })();
          /* SHINO_GLOBAL_NAV_LOADER_BEGIN */
          old loader
          /* SHINO_GLOBAL_NAV_LOADER_END */
          '@
          Set-Content -Path (Join-Path $static '_shared.js') -Value $fixture -Encoding UTF8
          Set-Content -Path (Join-Path $static 'shino-global-nav.js') -Value 'legacy' -Encoding UTF8
          Set-Content -Path (Join-Path $static 'shino-global-nav.css') -Value 'legacy' -Encoding UTF8
          .\scripts\sync_global_nav.ps1
          .\scripts\sync_global_nav.ps1
          if (Test-Path (Join-Path $static 'shino-global-nav.js')) { throw 'legacy global nav JS still present' }
          if (Test-Path (Join-Path $static 'shino-global-nav.css')) { throw 'legacy global nav CSS still present' }
          $shared = Get-Content (Join-Path $static '_shared.js') -Raw
          $count = ([regex]::Matches($shared, 'SHINO_GLOBAL_NAV_LOADER_BEGIN')).Count
          if ($count -ne 0) { throw "legacy global nav loader expected zero, got $count" }
          Write-Host 'legacy global navigation cleanup: OK'
      - name: Smoke status on detached HEAD runtime
        shell: powershell
        run: |
          $env:SHINO_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'shino-runtime'
          $jarvis = Join-Path $env:SHINO_RUNTIME_ROOT 'jarvis-OS'
          New-Item -ItemType Directory -Force -Path $jarvis | Out-Null
          git init $jarvis
          git -C $jarvis config user.email 'ci@shino.local'
          git -C $jarvis config user.name 'SHINO CI'
          Set-Content -Path (Join-Path $jarvis 'README.md') -Value 'detached-head-smoke'
          git -C $jarvis add README.md
          git -C $jarvis commit -m 'smoke fixture'
          $sha = (git -C $jarvis rev-parse HEAD).Trim()
          git -C $jarvis checkout --detach $sha
          .\shino.ps1 status
