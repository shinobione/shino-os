name: SHINO Overlay CI

on:
  push:
    branches: [integration/jarvis-upstream]
  pull_request:
    branches: [main]

jobs:
  overlay-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SHINO overlay
        run: python scripts/validate_overlay.py
      - name: Check command-center JavaScript syntax
        run: |
          find extensions/views/shino-command-center -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Compile Python view package
        run: |
          python -m py_compile \
            extensions/views/shino-command-center/tool.py \
            extensions/views/shino-command-center/skill.py

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\shino.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "shino.ps1 parse: OK"
      - name: Smoke status on detached HEAD runtime
        shell: powershell
        run: |
          $env:SHINO_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'shino-runtime'
          $jarvis = Join-Path $env:SHINO_RUNTIME_ROOT 'jarvis-OS'
          New-Item -ItemType Directory -Force -Path $jarvis | Out-Null
          git init $jarvis
          git -C $jarvis config user.email 'ci@shino.local'
          git -C $jarvis config user.name 'SHINO CI'
          Set-Content -Path (Join-Path $jarvis 'README.md') -Value 'detached-head-smoke'
          git -C $jarvis add README.md
          git -C $jarvis commit -m 'smoke fixture'
          $sha = (git -C $jarvis rev-parse HEAD).Trim()
          git -C $jarvis checkout --detach $sha
          .\shino.ps1 status
